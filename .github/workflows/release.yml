name: Build and release APK

# Every push to main builds the app and publishes it as a GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The GitHub-hosted Ubuntu runner already ships the Android SDK; just make sure the needed packages exist.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Signing secrets live in the self-hosted Infisical (project switch-phone-y1-nt, env prod).
      # Auth is GitHub OIDC (no stored secret): only the repo variables INFISICAL_IDENTITY_ID and INFISICAL_URL are needed.
      - name: Fetch signing secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          domain: ${{ vars.INFISICAL_URL }}
          project-slug: switch-phone-y1-nt
          env-slug: prod

      - name: Prepare release keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 missing from Infisical; refusing to publish an unsigned release" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signing=release key" >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK and Play Store bundle (AAB)
        run: ./gradlew --no-daemon assembleRelease bundleRelease -PversionName="$VERSION_NAME" -PversionCode="${{ github.run_number }}"

      - name: Name the artifacts
        run: |
          cp app/build/outputs/apk/release/app-release.apk "switch-phone-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "switch-phone-${VERSION_NAME}.aab"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION_NAME}" "switch-phone-${VERSION_NAME}.apk" "switch-phone-${VERSION_NAME}.aab" \
            --title "Switch Phone ${VERSION_NAME}" \
            --target "${{ github.sha }}" \
            --generate-notes
