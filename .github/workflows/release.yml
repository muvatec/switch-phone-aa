name: Build and release APK

# Every push to main builds the app and publishes it as a GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: configure the repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and
      # KEY_PASSWORD to sign with your own key. Without them the APK is signed with the debug key.
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "signing=release key" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "signing=debug key (no keystore secrets set)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease -PversionName="$VERSION_NAME" -PversionCode="${{ github.run_number }}"

      - name: Name the artifact
        run: cp app/build/outputs/apk/release/app-release.apk "switch-phone-${VERSION_NAME}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION_NAME}" "switch-phone-${VERSION_NAME}.apk" \
            --title "Switch Phone ${VERSION_NAME}" \
            --target "${{ github.sha }}" \
            --generate-notes
