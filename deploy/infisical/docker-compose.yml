# Infisical self-hosted for Coolify (Docker Compose service).
# No real values live here: set them in Coolify > service > Environment Variables
# (see .env.example and docs/INFISICAL.md).
services:
  infisical:
    image: infisical/infisical:latest-postgres # pin to a release tag once deployed
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?}
      - AUTH_SECRET=${AUTH_SECRET:?}
      - SITE_URL=${SITE_URL:?}
      - DB_CONNECTION_URI=postgresql://infisical:${POSTGRES_PASSWORD:?}@db:5432/infisical
      - REDIS_URL=redis://redis:6379
      - TELEMETRY_ENABLED=false
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=infisical
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=infisical
    volumes:
      - infisical-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - infisical-redis:/data

volumes:
  infisical-db:
  infisical-redis:
